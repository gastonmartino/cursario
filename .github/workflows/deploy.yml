name: Deploy a GitHub Pages

on:
  # Publica en cada push a la rama del release. Cuando cursario-v2 se una
  # a main, cambiar esta rama por main.
  push:
    branches: [cursario-v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Dirección de esta instancia (ver astro.config.mjs).
    env:
      SITE_URL: https://gastonmartino.github.io
      BASE_PATH: /cursario
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build con Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
